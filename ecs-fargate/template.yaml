AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Runs the "mixer" server on ECS Fargate, with a persistent EFS-backed volume
  mounted at /dbs for its custom database. Analogous to the eks-simple Helm
  chart (Deployment + PVC/PV backed by EBS), but using ECS Fargate + EFS.

Parameters:
  Env:
    Type: String
    Default: dev
    Description: Environment name, used to namespace resources (e.g. dev, staging, prod).

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to deploy into.

  SubnetOne:
    Type: AWS::EC2::Subnet::Id
    Description: First subnet for the Fargate service and EFS mount target (use a different AZ than SubnetTwo).

  SubnetTwo:
    Type: AWS::EC2::Subnet::Id
    Description: Second subnet for the Fargate service and EFS mount target (use a different AZ than SubnetOne).

  VpcCidrBlock:
    Type: String
    Description: CIDR block of the VPC above, used to scope security group ingress to in-VPC traffic.
    Default: 10.0.0.0/16

  AssignPublicIp:
    Type: String
    AllowedValues: [ENABLED, DISABLED]
    Default: DISABLED
    Description: >
      Whether the task gets a public IP. Leave DISABLED (matching the original
      ClusterIP-only Service) unless your subnets are public and lack a NAT gateway.

  ClusterName:
    Type: String
    Default: agents-cluster

  ImageRepository:
    Type: String
    Default: 250233190882.dkr.ecr.us-east-1.amazonaws.com/mixer

  ImageTag:
    Type: String
    Default: latest

  ContainerPort:
    Type: Number
    Default: 8000

  TaskCpu:
    Type: String
    Default: "2048"
    Description: Task-level vCPU units (Fargate has no separate request/limit; this is the hard cap, matching the chart's service.limits.cpu).

  TaskMemory:
    Type: String
    Default: "8192"
    Description: Task-level memory in MiB (matches the chart's service.limits.memory of 8Gi).

  Host:
    Type: String
    Default: agt-dev.self.remixlabs.com

  WorkspaceCreators:
    Type: String
    Default: "user/chris@remixlabs.com"

  AuthPublicKeyEndpoint:
    Type: String
    Default: "https://auth.remixlabs.com/a/x/jwks.json"

  AgentCacheSize:
    Type: String
    Default: "1GiB"

  AgentParamsLimit:
    Type: String
    Default: "10MiB"

  LogLevel:
    Type: String
    Default: "info"

  VolumeGid:
    Type: Number
    Default: 33
    Description: GID that owns the /dbs mount, via the EFS access point's root directory (analogous to the chart's fsGroup).

  LogRetentionDays:
    Type: Number
    Default: 30

Resources:
  # ---------- Networking ----------
  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "mixer-${Env} Fargate task"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref ContainerPort
          ToPort: !Ref ContainerPort
          CidrIp: !Ref VpcCidrBlock
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

  EfsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "mixer-${Env} EFS mount targets"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId: !Ref ServiceSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

  # ---------- Persistent volume (analogous to pvc.yaml's EBS PV/PVC) ----------
  AgentDbFileSystem:
    Type: AWS::EFS::FileSystem
    Properties:
      Encrypted: true
      FileSystemTags:
        - Key: Name
          Value: !Sub "agent-db-${Env}"

  EfsMountTargetOne:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref AgentDbFileSystem
      SubnetId: !Ref SubnetOne
      SecurityGroups:
        - !Ref EfsSecurityGroup

  EfsMountTargetTwo:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref AgentDbFileSystem
      SubnetId: !Ref SubnetTwo
      SecurityGroups:
        - !Ref EfsSecurityGroup

  AgentDbAccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref AgentDbFileSystem
      PosixUser:
        Uid: "0"
        Gid: !Ref VolumeGid
      RootDirectory:
        Path: "/dbs"
        CreationInfo:
          OwnerUid: "0"
          OwnerGid: !Ref VolumeGid
          Permissions: "0775"
      AccessPointTags:
        - Key: Name
          Value: !Sub "agent-db-${Env}"

  # ---------- Logs ----------
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/mixer-${Env}"
      RetentionInDays: !Ref LogRetentionDays

  # ---------- IAM ----------
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "mixer-${Env}-execution-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "mixer-${Env}-task-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: efs-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - elasticfilesystem:ClientMount
                  - elasticfilesystem:ClientWrite
                  - elasticfilesystem:ClientRootAccess
                Resource: !GetAtt AgentDbFileSystem.Arn
                Condition:
                  StringEquals:
                    elasticfilesystem:AccessPointArn: !GetAtt AgentDbAccessPoint.Arn

  # ---------- Compute (analogous to deployment.yaml) ----------
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "mixer-${Env}"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      Volumes:
        - Name: agent-db
          EFSVolumeConfiguration:
            FilesystemId: !Ref AgentDbFileSystem
            TransitEncryption: ENABLED
            AuthorizationConfig:
              AccessPointId: !Ref AgentDbAccessPoint
              IAM: ENABLED
      ContainerDefinitions:
        - Name: mixer
          Image: !Sub "${ImageRepository}:${ImageTag}"
          Essential: true
          PortMappings:
            - ContainerPort: !Ref ContainerPort
              Protocol: tcp
          LinuxParameters:
            Capabilities:
              Add: ["SYS_PTRACE"]
          Command:
            - "--host"
            - !Ref Host
            - "--agent-cache-size"
            - !Ref AgentCacheSize
            - "--params-limit"
            - !Ref AgentParamsLimit
            - "--jwks-url"
            - !Ref AuthPublicKeyEndpoint
          Environment:
            - Name: WORKSPACE_CREATORS
              Value: !Ref WorkspaceCreators
            - Name: RMX_HOST
              Value: !Ref Host
            - Name: RUST_LOG
              Value: !Ref LogLevel
          MountPoints:
            - SourceVolume: agent-db
              ContainerPath: /dbs
          HealthCheck:
            Command:
              - CMD-SHELL
              - !Sub "curl -f http://localhost:${ContainerPort}/ || exit 1"
            Interval: 15
            Timeout: 5
            Retries: 3
            StartPeriod: 30
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: mixer

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref ClusterName

  # ---------- Service (analogous to service.yaml's ClusterIP Service) ----------
  Service:
    Type: AWS::ECS::Service
    DependsOn:
      - EfsMountTargetOne
      - EfsMountTargetTwo
    Properties:
      ServiceName: !Sub "agent-server-${Env}"
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      LaunchType: FARGATE
      DesiredCount: 1
      # Stop the old task before starting the replacement, since only one
      # task can safely hold the custom database at a time (same reasoning
      # as the chart's `strategy: Recreate`).
      DeploymentConfiguration:
        MaximumPercent: 100
        MinimumHealthyPercent: 0
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: !Ref AssignPublicIp
          Subnets:
            - !Ref SubnetOne
            - !Ref SubnetTwo
          SecurityGroups:
            - !Ref ServiceSecurityGroup

Outputs:
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
  TaskDefinitionArn:
    Value: !Ref TaskDefinition
  EfsFileSystemId:
    Value: !Ref AgentDbFileSystem
  EfsAccessPointId:
    Value: !Ref AgentDbAccessPoint
  LogGroupName:
    Value: !Ref LogGroup
